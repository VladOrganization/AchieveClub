services:
  frontend:
    image: ghcr.io/vladorganization/achieve_club_frontend:latest
    container_name: achieve_club_frontend
    restart: always
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.achieve-front.rule=Host(`app.byteschool.by`)
      - traefik.http.routers.achieve-front.entrypoints=websecure
      - traefik.http.routers.achieve-front.tls.certresolver=le
      - traefik.http.services.achieve-front.loadbalancer.server.port=80

  backend:
    image: ghcr.io/vladorganization/achieve_club_backend:latest
    container_name: achieve_club_backend
    restart: always
    env_file: stack.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /home/ftpuser/ftp/upload/wwwroot:/app/wwwroot
    environment:
      # Staging, а не Production: в Production приложение требует PEM-сертификаты
      # и делает редирект на HTTPS. TLS теперь терминирует Traefik.
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__RedisConnection=redis:6379,password=${REDIS_PASSWORD}
    networks:
      - web
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.achieve-api.rule=Host(`app.byteschool.by`)
      - traefik.http.routers.achieve-api.entrypoints=api
      - traefik.http.routers.achieve-api.tls.certresolver=le
      - traefik.http.services.achieve-api.loadbalancer.server.port=8080

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    env_file: stack.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    command: --interval 300 --debug ghcr.io/vladorganization/achieve_club_backend
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  web:
    external: true
  backend:
    driver: bridge
